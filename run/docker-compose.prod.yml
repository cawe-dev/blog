version: '3.9'

name: cawe_blog_prod

services:
  app:
    build:
      context: ../
      dockerfile: run/php/Dockerfile
    container_name: cawe_blog_app
    restart: always
    environment:
      APP_ENV: production
    volumes:
      - ../:/var/www/application
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: cawe_blog_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ../:/var/www/application
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  postgres:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: cawe_blog_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - cawe_prod_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    build:
      context: ./redis
      dockerfile: Dockerfile
    container_name: cawe_blog_redis
    restart: always
    volumes:
      - cawe_prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 3

volumes:
  cawe_prod_db_data:
  cawe_prod_redis_data:
  